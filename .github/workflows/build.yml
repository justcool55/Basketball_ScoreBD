name: Build Android APK

# main 브랜치에 push 하거나, Actions 탭에서 수동 실행하면 빌드가 돌아간다.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # buildozer 는 JDK 17 을 쓴다.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev \
            cmake libffi-dev libssl-dev \
            build-essential ccache
          # libtinfo5 는 22.04 에만, 24.04 에는 libtinfo6. 없어도 빌드가 죽지 않게.
          sudo apt-get install -y libtinfo5 || sudo apt-get install -y libtinfo6 || true

      - name: Install Buildozer & Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36

      # 공식 액션으로 안드로이드 cmdline-tools 를 설치한다.
      # 이걸로 "진짜" sdkmanager 를 얻어, 현재 유효한 모든 라이선스를 동의한다.
      - name: Set up Android SDK & accept ALL licenses
        uses: android-actions/setup-android@v3

      - name: Accept every SDK license (real hashes)
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          echo "=== 동의된 라이선스 파일 목록 ===" && ls -1 "$ANDROID_SDK_ROOT/licenses"

      # buildozer 는 자기만의 SDK 를 ~/.buildozer 에 따로 받는다.
      # 위에서 동의한 "실제" 라이선스 파일을 buildozer 의 SDK 경로에 복사해 두면,
      # buildozer 가 build-tools(최신 37 포함)를 설치할 때 라이선스가 이미 동의된 상태가 된다.
      # → run 1 의 "Aidl not found (build-tools license not accepted)" 를 근본 해결.
      - name: Pre-seed buildozer SDK with accepted licenses
        run: |
          DST="$HOME/.buildozer/android/platform/android-sdk/licenses"
          mkdir -p "$DST"
          cp -f "$ANDROID_SDK_ROOT/licenses/"* "$DST/" || true
          echo "=== buildozer SDK 라이선스 심음 ===" && ls -1 "$DST"

      - name: Build debug APK
        run: |
          buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: basketball-scoreboard-apk
          path: bin/*.apk
          if-no-files-found: error
