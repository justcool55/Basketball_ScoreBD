name: Build Android APK

# main 브랜치에 push 하거나, Actions 탭에서 수동 실행하면 빌드가 돌아간다.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # buildozer 는 JDK 17 을 쓴다. 러너 기본 JDK 버전에 휘둘리지 않도록 고정.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # 우분투 22.04 / 24.04 어디서든 되도록 필수 패키지만 먼저 설치한다.
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev \
            cmake libffi-dev libssl-dev \
            build-essential ccache
          # libtinfo5 는 22.04 에만 있고 24.04 에는 없다(libtinfo6).
          # 없는 쪽에서 빌드 전체가 죽지 않도록 실패를 무시한다.
          sudo apt-get install -y libtinfo5 || sudo apt-get install -y libtinfo6 || true

      - name: Install Buildozer & Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36

      # restore-keys 가 있어야 buildozer.spec 을 고쳐도 SDK/NDK 를 다시
      # 내려받지 않는다 (없으면 매번 30분+ 재다운로드).
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-global-

      - name: Cache Buildozer project directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-project-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-project-

      # buildozer 1.5.0 의 accept_sdk_license 는 최신 build-tools(37)의
      # 새 라이선스를 자동 동의하지 못해, build-tools 설치가 스킵되고
      # 그 안의 aidl 을 못 찾아 빌드가 죽는다(Aidl not found).
      # → sdkmanager 가 검사하는 licenses 폴더에 동의 해시를 미리 심어
      #   "모든 라이선스 동의됨" 상태로 만들어 준다.
      - name: Pre-accept Android SDK licenses
        run: |
          SDK_LIC="$HOME/.buildozer/android/platform/android-sdk/licenses"
          mkdir -p "$SDK_LIC"
          printf '\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee' > "$SDK_LIC/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910' > "$SDK_LIC/android-sdk-preview-license"
          printf '\n859f317696f67ef3d7f30a50a5560e7834b43903' > "$SDK_LIC/android-sdk-arm-dbt-license"
          printf '\n601085b94cd77f0b54ff86406957099ebe79c4d6' > "$SDK_LIC/android-googletv-license"
          printf '\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a' > "$SDK_LIC/google-gdk-license"
          echo "licenses 폴더 준비 완료:" && ls -1 "$SDK_LIC"

      - name: Build debug APK
        run: |
          buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: basketball-scoreboard-apk
          path: bin/*.apk
          if-no-files-found: error
