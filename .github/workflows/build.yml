name: Build Android APK

# main 브랜치에 push 하거나, Actions 탭에서 수동 실행하면 빌드가 돌아간다.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # buildozer 공식 Docker 이미지(kivy/buildozer)에서 빌드한다.
      # 안드로이드 SDK / NDK / build-tools / 라이선스 동의가 이미지 안에
      # 미리 세팅돼 있어, 호스트에 직접 깔 때 나던 라이선스/aidl 문제가 없다.
      - name: Build debug APK (Docker)
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: stable

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: basketball-scoreboard-apk
          # 액션이 APK 를 프로젝트 루트에 만들어 두므로 두 위치 모두 검색
          path: |
            bin/*.apk
            *.apk
          if-no-files-found: error
