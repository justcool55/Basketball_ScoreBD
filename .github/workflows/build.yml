name: Build Android APK

# main 브랜치에 push 하거나, Actions 탭에서 수동 실행하면 빌드가 돌아간다.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool libtool-bin gettext m4 \
            pkg-config \
            zlib1g-dev libncurses-dev \
            cmake libffi-dev libssl-dev \
            build-essential ccache
          # 참고: automake 가 있어야 autoreconf 가 aclocal 로 libtool 매크로
          # (LT_SYS_SYMBOL_USCORE 등)를 수집한다. 이게 없으면 libffi 레시피가
          # "possibly undefined macro" 로 실패한다.
          sudo apt-get install -y libtinfo5 || sudo apt-get install -y libtinfo6 || true

      - name: Install Buildozer & Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36

      # buildozer 가 "자기" SDK(최신 cmdline-tools) 를 직접 관리하게 둔다.
      # 이 sdkmanager 는 JDK 17 에서 정상 동작한다(run 1 에서 확인).
      # 유일하게 남은 문제는 build-tools 최신판 라이선스 자동동의 실패이므로,
      # buildozer 가 받아온 그 sdkmanager 로 "모든 라이선스"를 우리가 직접 동의시킨 뒤
      # 다시 빌드한다(2-패스).
      - name: Build debug APK
        run: |
          set +e
          echo "===== 1차: buildozer가 SDK 도구를 내려받게 한다 (라이선스에서 실패해도 OK) ====="
          buildozer android debug 2>&1 | tee pass1.log

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          # buildozer 1.5.0 은 구식 tools/bin/sdkmanager 를 쓴다. 그걸 그대로 찾아서
          # (없으면 cmdline-tools 쪽도) 모든 라이선스를 우리가 직접 동의시킨다.
          SDKMANAGER=$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "찾은 sdkmanager: $SDKMANAGER"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager 를 찾지 못했습니다. pass1.log 확인 필요."
            exit 1
          fi

          echo "===== 모든 SDK 라이선스 동의 ====="
          # buildozer 가 실행하던 것과 동일하게 SDK 폴더에서 실행한다.
          ( cd "$SDK" && yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses 2>&1 | tail -8 )
          echo "동의된 licenses:" && ls -1 "$SDK/licenses" 2>/dev/null || echo "(licenses 폴더 없음)"

          echo "===== 2차: 실제 빌드 (이제 platform-tools / build-tools 설치 가능) ====="
          set -o pipefail
          buildozer android debug 2>&1 | tee buildozer_build.log

      # 실패하든 성공하든 전체 빌드 로그를 파일로 남긴다.
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: |
            pass1.log
            buildozer_build.log
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: basketball-scoreboard-apk
          path: bin/*.apk
          if-no-files-found: error
